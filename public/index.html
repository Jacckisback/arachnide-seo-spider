<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arachnide SEO Spider</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo" data-icon="spider"></span><span class="name">Arachnide <small>SEO Spider</small></span><span id="version" class="ver"></span></div>
    <form id="crawlForm" class="crawl-form" autocomplete="off">
      <div class="seg mode" id="modeSeg">
        <button type="button" data-mode="spider" data-i18n="opt.modeSpider">Spider</button>
        <button type="button" data-mode="list" data-i18n="opt.modeList">List</button>
      </div>
      <input id="urlInput" type="text" inputmode="url" data-i18n-ph="ui.urlPlaceholder" placeholder="https://www.example.com" required>
      <textarea id="listInput" rows="1" data-i18n-ph="ui.listPlaceholder" hidden></textarea>
      <button id="startBtn" class="btn primary" type="submit" data-icon="play"><span data-i18n="ui.crawl">Crawl</span></button>
      <button id="stopBtn" class="btn danger" type="button" data-icon="stop" hidden><span data-i18n="ui.stop">Stop</span></button>
      <button id="optionsBtn" class="btn" type="button" aria-expanded="false" data-icon="settings"><span data-i18n="ui.options">Options</span></button>
    </form>
    <div class="top-actions">
      <button id="reportBtn" class="btn accent" type="button" data-icon="report" disabled><span data-i18n="ui.report">Report</span></button>
      <button id="historyBtn" class="btn icon" type="button" data-icon="history" data-i18n-title="ui.history"></button>
      <label class="btn icon" data-icon="folder" data-i18n-title="ui.open"><input id="importInput" type="file" accept=".json,application/json" hidden></label>
      <button id="exportJsonBtn" class="btn icon" type="button" data-icon="download" data-i18n-title="ui.exportJson" disabled></button>
      <label class="lang" data-icon="globe"><select id="langSel" aria-label="Language"></select></label>
      <button id="themeBtn" class="btn icon" type="button" data-icon="moon" data-i18n-title="ui.theme"></button>
    </div>
  </header>

  <dialog id="configDialog" class="wide config">
    <form id="configForm" method="dialog">
      <div class="dialog-head"><h2 data-icon="settings"><span data-i18n="cfg.title">Configuration</span></h2><button class="btn icon" value="close" data-icon="x" data-i18n-title="ui.close"></button></div>
      <div class="cfg">
        <nav class="cfg-nav" id="cfgNav">
          <button type="button" data-cfg="spider" class="on" data-i18n="cfg.spider">Spider</button>
          <button type="button" data-cfg="limits" data-i18n="cfg.limits">Limits</button>
          <button type="button" data-cfg="speed" data-i18n="cfg.speed">Speed</button>
          <button type="button" data-cfg="robots" data-i18n="cfg.robots">robots.txt</button>
          <button type="button" data-cfg="render" data-i18n="cfg.render">Rendering</button>
          <button type="button" data-cfg="scope" data-i18n="cfg.scope">Include / exclude</button>
          <button type="button" data-cfg="extract" data-i18n="cfg.extract">Extraction</button>
          <button type="button" data-cfg="auth" data-i18n="cfg.auth">Authentication</button>
        </nav>
        <div class="cfg-body">
          <section data-pane="spider">
            <p class="cfg-help" data-i18n="cfg.spiderHelp"></p>
            <label class="check"><input type="checkbox" name="useSitemaps" checked> <span data-i18n="opt.sitemaps">Read XML sitemaps</span></label>
            <label class="check"><input type="checkbox" name="crawlCanonicals" checked> <span data-i18n="opt.canonicals">Follow canonicals</span></label>
            <label class="check"><input type="checkbox" name="crawlSubdomains"> <span data-i18n="opt.subdomains">Include subdomains</span></label>
            <label class="check"><input type="checkbox" name="checkExternal"> <span data-i18n="opt.external">Check external links</span></label>
            <label class="check"><input type="checkbox" name="checkImages"> <span data-i18n="opt.images">Check images</span></label>
          </section>
          <section data-pane="limits" hidden>
            <p class="cfg-help" data-i18n="cfg.limitsHelp"></p>
            <div class="cfg-grid">
              <label><span data-i18n="opt.maxPages">Limit crawl total</span><input name="maxPages" type="number" min="1" value="500"></label>
              <label><span data-i18n="opt.maxDepth">Limit crawl depth</span><input name="maxDepth" type="number" min="0" value="20"></label>
              <label><span data-i18n="opt.limitPerDepth">URLs per crawl depth</span><input name="limitPerDepth" type="number" min="1" data-i18n-ph="cfg.unlimited"></label>
              <label><span data-i18n="opt.maxFolderDepth">Max folder depth</span><input name="maxFolderDepth" type="number" min="0" data-i18n-ph="cfg.unlimited"></label>
              <label><span data-i18n="opt.maxQueryParams">Max query strings</span><input name="maxQueryParams" type="number" min="0" data-i18n-ph="cfg.unlimited"></label>
              <label><span data-i18n="opt.maxRedirects">Max redirects to follow</span><input name="maxRedirects" type="number" min="0" value="10"></label>
              <label><span data-i18n="opt.maxUrlLength">Max URL length</span><input name="maxUrlLength" type="number" min="20" value="2000"></label>
              <label><span data-i18n="opt.maxLinksPerPage">Max links per URL</span><input name="maxLinksPerPage" type="number" min="1" value="10000"></label>
              <label><span data-i18n="opt.maxPageSizeKb">Max page size (KB)</span><input name="maxPageSizeKb" type="number" min="10" value="51200"></label>
            </div>
            <label class="block"><span data-i18n="opt.pathLimits">Limit by URL path</span><textarea name="pathLimits" rows="3" placeholder="/blog/ = 200&#10;/produits/ = 1000"></textarea><small data-i18n="opt.pathLimitsHelp"></small></label>
          </section>
          <section data-pane="speed" hidden>
            <p class="cfg-help" data-i18n="cfg.speedHelp"></p>
            <div class="cfg-grid">
              <label><span data-i18n="opt.concurrency">Max threads</span><input name="concurrency" type="number" min="1" max="30" value="5"></label>
              <label><span data-i18n="opt.maxUrlPerSec">Max URL/s</span><input name="maxUrlPerSec" type="number" min="0" step="0.5" data-i18n-ph="cfg.unlimited"></label>
              <label><span data-i18n="opt.timeout">Timeout (ms)</span><input name="timeoutMs" type="number" min="1000" value="20000"></label>
            </div>
          </section>
          <section data-pane="robots" hidden>
            <p class="cfg-help" data-i18n="cfg.robotsHelp"></p>
            <div class="radios">
              <label class="check"><input type="radio" name="robotsMode" value="respect" checked> <span><b data-i18n="opt.robotsRespect">Respect robots.txt</b><small data-i18n="opt.robotsRespectHelp"></small></span></label>
              <label class="check"><input type="radio" name="robotsMode" value="report"> <span><b data-i18n="opt.robotsReport">Ignore robots.txt but report status</b><small data-i18n="opt.robotsReportHelp"></small></span></label>
              <label class="check"><input type="radio" name="robotsMode" value="ignore"> <span><b data-i18n="opt.robotsIgnore">Ignore robots.txt</b><small data-i18n="opt.robotsIgnoreHelp"></small></span></label>
            </div>
            <label class="block"><span data-i18n="opt.customRobots">Custom robots.txt</span><textarea name="customRobots" rows="6" class="mono" placeholder="User-agent: *&#10;Disallow: /admin/"></textarea><small data-i18n="opt.customRobotsHelp"></small></label>
            <div class="robots-test"><input id="robotsTestUrl" type="text" placeholder="https://www.example.com/page"><button type="button" class="btn" id="robotsTestBtn" data-i18n="cfg.test">Test</button><span id="robotsTestOut"></span></div>
          </section>
          <section data-pane="render" hidden>
            <label class="check big"><input type="checkbox" name="render"> <span><b data-i18n="opt.render">JavaScript rendering</b><small data-i18n="opt.renderHelp"></small></span></label>
            <p id="renderNote" class="opt-note"></p>
            <div class="cfg-grid">
              <label><span data-i18n="opt.userAgent">User-agent</span>
                <select name="userAgent">
                  <option value="arachnide">ArachnideSEO</option>
                  <option value="googlebot">Googlebot desktop</option>
                  <option value="googlebotMobile">Googlebot smartphone</option>
                  <option value="chrome">Chrome</option>
                </select>
              </label>
              <label><span data-i18n="opt.acceptLanguage">Accept-Language</span><input name="acceptLanguage" type="text" placeholder="fr-FR,fr;q=0.9"></label>
            </div>
          </section>
          <section data-pane="scope" hidden>
            <div class="cfg-grid one">
              <label><span data-i18n="opt.include">Include only (regex)</span><input name="include" type="text" placeholder="/blog/"></label>
              <label><span data-i18n="opt.exclude">Exclude (regex)</span><input name="exclude" type="text" placeholder="\?(replytocom|share)=|/wp-admin/"></label>
              <label><span data-i18n="opt.removeParams">Remove URL parameters</span><input name="removeParams" type="text" placeholder="utm_*, gclid, fbclid, sessionid"><small data-i18n="opt.removeParamsHelp"></small></label>
              <label><span data-i18n="opt.search">Custom search</span><input name="search" type="text" data-i18n-ph="opt.searchPh"></label>
            </div>
            <label class="check"><input type="checkbox" name="ignoreQuery"> <span data-i18n="opt.ignoreQuery">Ignore all URL parameters</span></label>
          </section>
          <section data-pane="extract" hidden>
            <p class="cfg-help" data-i18n="cfg.extractHelp"></p>
            <div id="extractors"></div>
            <button type="button" class="btn small" id="addExtractor" data-i18n="cfg.addExtractor">+ Add</button>
          </section>
          <section data-pane="auth" hidden>
            <p class="cfg-help" data-i18n="cfg.authHelp"></p>
            <div class="cfg-grid">
              <label><span data-i18n="opt.httpUser">User</span><input name="httpUser" type="text" autocomplete="off"></label>
              <label><span data-i18n="opt.httpPass">Password</span><input name="httpPass" type="password" autocomplete="new-password"></label>
            </div>
            <label class="block"><span data-i18n="opt.customHeaders">Custom HTTP headers</span><textarea name="customHeaders" rows="3" class="mono" placeholder="Cookie: session=…&#10;X-Preview-Token: …"></textarea><small data-i18n="opt.customHeadersHelp"></small></label>
          </section>
        </div>
      </div>
      <div class="dialog-foot"><button type="button" class="btn" id="cfgReset" data-i18n="cfg.reset">Reset</button><span class="spacer"></span><button class="btn primary" value="ok" data-i18n="cfg.done">OK</button></div>
    </form>
  </dialog>

  <div class="progress" id="progress" hidden>
    <div class="bar"><span id="progressBar"></span></div>
    <div id="progressText" class="progress-text"></div>
  </div>

  <main class="layout">
    <nav id="tabs" class="tabs" aria-label="Tabs"></nav>
    <section class="content">
      <div id="view" class="view"></div>
      <div id="detail" class="detail" hidden></div>
    </section>
  </main>

  <dialog id="historyDialog">
    <form method="dialog" class="dialog-head"><h2 data-i18n="ui.history">History</h2><button class="btn icon" data-icon="x" data-i18n-title="ui.close"></button></form>
    <div id="historyList" class="dialog-body"></div>
  </dialog>

  <dialog id="reportDialog" class="wide">
    <form id="reportForm" class="report-form">
      <div class="dialog-head"><h2 data-icon="report"><span data-i18n="report.dialogTitle">SEO report</span></h2><button class="btn icon" value="cancel" formnovalidate data-icon="x" data-i18n-title="ui.close"></button></div>
      <div class="dialog-body">
        <p class="muted" data-i18n="report.dialogHelp"></p>
        <div class="rf-grid">
          <label><span data-i18n="report.language">Report language</span><select name="lang"></select></label>
          <label><span data-i18n="report.titleField">Title</span><input name="title" type="text" data-i18n-ph="report.defaultTitle"></label>
          <label><span data-i18n="report.client">Client</span><input name="client" type="text"></label>
          <label><span data-i18n="report.author">Prepared by</span><input name="author" type="text"></label>
          <label><span data-i18n="report.company">Company / agency</span><input name="company" type="text"></label>
          <label><span data-i18n="report.contact">Contact</span><input name="contact" type="text" placeholder="contact@…"></label>
          <label><span data-i18n="report.website">Website</span><input name="website" type="text" placeholder="https://…"></label>
          <label><span data-i18n="report.color">Brand colour</span><input name="color" type="color" value="#5b8c1e"></label>
          <label><span data-i18n="report.compare">Compare with</span><select name="compare"></select></label>
          <label><span data-i18n="report.maxUrls">Example URLs per issue</span><input name="maxUrls" type="number" min="0" max="200" value="10"></label>
          <div class="logo-field"><span data-i18n="report.logo">Logo</span>
            <div class="logo-row"><span id="logoPreview" class="logo-preview"></span>
              <label class="btn small"><span data-i18n="report.chooseLogo">Choose…</span><input id="logoInput" type="file" accept="image/*" hidden></label>
              <button type="button" class="btn small" id="logoClear" data-i18n="ui.delete">Remove</button></div>
          </div>
          <label class="wide"><span data-i18n="report.intro">Introduction</span><textarea name="intro" rows="3" data-i18n-ph="report.introPh"></textarea></label>
        </div>
      </div>
      <div class="dialog-foot">
        <button type="button" class="btn" id="exportIssuesBtn" data-icon="download"><span data-i18n="report.csvAll">All issues (CSV)</span></button>
        <span class="spacer"></span>
        <button class="btn" value="cancel" formnovalidate data-i18n="ui.cancel">Cancel</button>
        <button class="btn primary" value="ok" data-icon="report"><span data-i18n="report.generate">Generate report</span></button>
      </div>
    </form>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
